services:
  - type: web
    name: portfolio-backend
    runtime: node
    plan: free
    region: oregon

    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: FRONTEND_ORIGIN
        value: https://portfolio-frontend.onrender.com

      - key: MONGODB_URI
        fromDatabase:
          name: portfolio-db
          property: connectionString

      - key: GMAIL_USER
        sync: false

      - key: GMAIL_APP_PASSWORD
        sync: false

      - key: MAIL_TO
        value: sakshi.ptr16@gmail.com

  - type: web
    name: portfolio-frontend
    runtime: static
    plan: free
    region: oregon

    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        value: https://portfolio-backend.onrender.com

databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio_db
    user: portfolio_user